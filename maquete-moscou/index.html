<title>Maquete de Moscou</title>
<meta name="description" content="Protótipo 3D interativo da maquete de Moscou com o passo a passo de cada peça em EVA, papelão, cola e massinha.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Patrick+Hand&display=swap">
<style>
  :root {
    --bg: #ECEEE8;
    --surface: #FFFFFF;
    --surface-2: #F3F4F0;
    --ink: #1A1C20;
    --muted: #565C66;
    --line: #D8DBD2;
    --line-strong: #B9BDB2;
    --accent: #B8202F;
    --accent-ink: #FFFFFF;
    --ok: #1F7A45;
    --ok-ink: #FFFFFF;
    --ok-soft: #E2F2E8;
    --warn: #8A5200;
    --warn-soft: #FCEFD8;
    --hard: #B8202F;
    --hard-soft: #FBE8EA;
    --tape: #EAD8A4;
    --tape-ink: #45370F;
    --mat: #2A5E4D;
    --mat-line: rgba(255, 255, 255, .07);
    --mat-line-2: rgba(255, 255, 255, .15);
    --on-mat: #EAF4EE;
    --sw-border: rgba(0, 0, 0, .2);
    --focus: #1F5FD1;
    --shadow: 0 1px 2px rgba(25, 30, 25, .06), 0 12px 32px -14px rgba(25, 30, 25, .22);
    --r: 16px;
    --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315;
      --surface: #1A1D21;
      --surface-2: #22262B;
      --ink: #ECEEF1;
      --muted: #A7ADB7;
      --line: #2F343B;
      --line-strong: #474D56;
      --accent: #F0616E;
      --accent-ink: #1C0A0D;
      --ok: #5CC98C;
      --ok-ink: #0D2417;
      --ok-soft: #16301F;
      --warn: #F2B55A;
      --warn-soft: #36270E;
      --hard: #F0616E;
      --hard-soft: #3A1C21;
      --tape: #5E4E24;
      --tape-ink: #F6E7BF;
      --mat: #173A30;
      --mat-line: rgba(255, 255, 255, .05);
      --mat-line-2: rgba(255, 255, 255, .11);
      --on-mat: #DDEBE3;
      --sw-border: rgba(255, 255, 255, .28);
      --focus: #86ABFF;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -14px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111315;
    --surface: #1A1D21;
    --surface-2: #22262B;
    --ink: #ECEEF1;
    --muted: #A7ADB7;
    --line: #2F343B;
    --line-strong: #474D56;
    --accent: #F0616E;
    --accent-ink: #1C0A0D;
    --ok: #5CC98C;
    --ok-ink: #0D2417;
    --ok-soft: #16301F;
    --warn: #F2B55A;
    --warn-soft: #36270E;
    --hard: #F0616E;
    --hard-soft: #3A1C21;
    --tape: #5E4E24;
    --tape-ink: #F6E7BF;
    --mat: #173A30;
    --mat-line: rgba(255, 255, 255, .05);
    --mat-line-2: rgba(255, 255, 255, .11);
    --on-mat: #DDEBE3;
    --sw-border: rgba(255, 255, 255, .28);
    --focus: #86ABFF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Estrutura ---------- */
  .app { min-height: 100%; display: flex; flex-direction: column; }
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
  .brand h1 { white-space: nowrap; }
  .logo { width: 38px; height: 38px; flex: none; }
  .brand h1 { margin: 0; font: 800 20px/1.1 var(--font-display); letter-spacing: -.01em; }
  .brand p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
  .prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { width: 120px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; transition: width .45s ease; }

  .main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 0 16px 16px; }

  /* ---------- Visualizador 3D (tapete de corte) ---------- */
  .viewer {
    position: relative; overflow: hidden; border-radius: var(--r);
    height: 58vh; height: min(58svh, 560px); min-height: 330px;
    background-color: var(--mat);
    background-image:
      linear-gradient(var(--mat-line-2) 1px, transparent 1px),
      linear-gradient(90deg, var(--mat-line-2) 1px, transparent 1px),
      linear-gradient(var(--mat-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    background-position: -1px -1px;
    box-shadow: var(--shadow);
  }
  .viewer::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 95% at 50% 42%, transparent 55%, rgba(0, 0, 0, .3));
  }
  .viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; touch-action: none; outline: none; }
  .viewer canvas.is-hot { cursor: pointer; }
  .hint {
    position: absolute; top: 12px; left: 14px; right: 14px; z-index: 3; pointer-events: none;
    color: var(--on-mat); font-size: 12.5px; line-height: 1.35;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
  }
  .toolbar { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
  .tb {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 6px;
    min-height: 38px; padding: 8px 13px; border: 0; border-radius: 99px;
    background: var(--surface); color: var(--ink);
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .28);
    transition: background .2s, color .2s, transform .12s;
  }
  .tb:hover { transform: translateY(-1px); }
  .tb:active { transform: translateY(0); }
  .tb[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .tb svg { width: 16px; height: 16px; flex: none; }

  .pins { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .pins[hidden] { display: none !important; }
  .pin {
    position: absolute; left: 0; top: 0; pointer-events: auto;
    width: 28px; height: 28px; border-radius: 50%; padding: 0;
    display: grid; place-items: center;
    background: #FFFFFF; color: #1A1C20; border: 2px solid #B8202F;
    font: 700 13px/1 var(--font-ui); font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .35); cursor: pointer;
    transition: scale .15s, background .2s, color .2s, opacity .2s;
  }
  .pin:hover, .pin:focus-visible { scale: 1.15; }
  .pin.is-active { background: #B8202F; color: #FFFFFF; border-color: #FFFFFF; scale: 1.15; }
  .pin.is-done:not(.is-active) { border-color: #1F7A45; }
  .pin.is-dim { opacity: .5; }
  .pin::after {
    content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 7px); translate: -50% 0;
    white-space: nowrap; padding: 4px 8px; border-radius: 6px;
    background: #1A1C20; color: #FFFFFF; font-size: 12px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .pin:hover::after, .pin:focus-visible::after { opacity: 1; }

  .tooltip {
    position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none;
    padding: 8px 11px; border-radius: 10px; max-width: 230px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
    font-size: 13px; line-height: 1.35;
  }
  .tooltip b { display: block; font-size: 14px; }
  .tooltip span { color: var(--muted); }

  .loading {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; align-content: center; gap: 12px;
    padding: 24px; text-align: center; color: var(--on-mat); font-weight: 700; background: var(--mat);
  }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .25); border-top-color: #FFFFFF; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading.is-error .spin { display: none; }
  .loading p { margin: 0; max-width: 34ch; font-weight: 400; }

  /* ---------- Painel de instruções ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
  .stepper {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; gap: 8px; overflow-x: auto; padding: 12px;
    background: var(--surface); border-bottom: 1px solid var(--line);
    border-radius: var(--r) var(--r) 0 0; scrollbar-width: thin;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 22px), transparent);
            mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 22px), transparent);
  }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    min-height: 38px; padding: 5px 13px 5px 5px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer;
    font-size: 14px; white-space: nowrap;
    transition: background .2s, border-color .2s, color .2s;
  }
  .chip:hover { border-color: var(--ink); }
  .chip .n {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface-2); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums;
    transition: background .2s, color .2s;
  }
  .chip .n svg { width: 14px; height: 14px; }
  .chip.is-done .n { background: var(--ok); color: var(--ok-ink); }
  .chip.is-active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip.is-active .n { background: var(--accent); color: var(--accent-ink); }

  .content { padding: 22px 20px 28px; scroll-margin-top: 72px; }
  .content > section { margin-top: 26px; }
  .eyebrow {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line-strong); }
  .lvl { padding: 3px 9px; border-radius: 99px; letter-spacing: .05em; }
  .lvl-facil { background: var(--ok-soft); color: var(--ok); }
  .lvl-medio { background: var(--warn-soft); color: var(--warn); }
  .lvl-dificil { background: var(--hard-soft); color: var(--hard); }
  .content h2 {
    margin: 10px 0 8px; font: 800 clamp(27px, 3.2vw, 33px)/1.08 var(--font-display);
    letter-spacing: -.02em; text-wrap: balance;
  }
  .content h3 { margin: 0 0 12px; font: 700 18px/1.25 var(--font-display); letter-spacing: -.005em; }
  .content h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .lead { margin: 0; color: var(--muted); max-width: 62ch; }

  /* Fita crepe com as medidas */
  .tapes { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 10px 8px; }
  .tape {
    padding: 8px 15px; font-size: 13.5px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums;
    color: var(--tape-ink);
    background: linear-gradient(90deg, rgba(255, 255, 255, .22), transparent 25%, transparent 75%, rgba(255, 255, 255, .16)), var(--tape);
    clip-path: polygon(0 0, 100% 0, calc(100% - 3px) 20%, 100% 40%, calc(100% - 3px) 60%, 100% 80%, calc(100% - 2px) 100%, 0 100%, 3px 80%, 0 60%, 3px 40%, 0 20%);
    transform: rotate(-.8deg);
  }
  .tape:nth-child(even) { transform: rotate(.7deg); }

  .mats { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
  .mats li { display: flex; gap: 11px; align-items: flex-start; }
  .sw { flex: none; width: 18px; height: 18px; margin-top: 3px; border-radius: 4px; background: var(--sw); border: 1px solid var(--sw-border); }
  .sw-clay { border-radius: 50%; box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .14); }
  .sw-tool { background: none; border: 1.5px dashed var(--muted); border-radius: 50%; }

  .h3row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .h3row h3 { margin: 0; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .steps { list-style: none; padding: 0; margin: 0 -10px; display: grid; gap: 2px; }
  .step {
    position: relative; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start;
    padding: 10px; border-radius: 12px; cursor: pointer; transition: background .2s;
  }
  .step:hover { background: var(--surface-2); }
  .step input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .step .num {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--line-strong); background: var(--surface);
    font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
    transition: background .2s, border-color .2s, color .2s;
  }
  .step input:checked + .num { background: var(--ok); border-color: var(--ok); color: transparent; font-size: 0; }
  .step input:checked + .num::after {
    content: ""; width: 12px; height: 7px; border-left: 2.5px solid var(--ok-ink); border-bottom: 2.5px solid var(--ok-ink);
    transform: translate(0, -2px) rotate(-45deg);
  }
  .step input:focus-visible + .num { outline: 3px solid var(--focus); outline-offset: 2px; }
  .step .txt { padding-top: 4px; }
  .step input:checked ~ .txt { color: var(--muted); }
  .step .txt b { color: var(--ink); font-weight: 700; }

  /* Dica com linha de recorte */
  .tipbox { margin-top: 24px; padding: 14px 16px 15px; border: 2px dashed var(--line-strong); border-radius: 14px; background: var(--surface-2); }
  .tiplabel { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .tiplabel svg { width: 16px; height: 16px; }
  .tipbox p { margin: 6px 0 0; }

  .pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 26px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding: 11px 16px; border-radius: 12px;
    border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
    font-weight: 700; font-size: 15px; text-align: left;
    transition: background .2s, border-color .2s, transform .1s, filter .2s;
  }
  .btn:hover { border-color: var(--ink); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { border-color: var(--accent); filter: brightness(1.07); }
  .btn-ghost { border-color: transparent; color: var(--muted); font-weight: 400; font-size: 14px; }
  .btn-ghost:hover { border-color: var(--line-strong); color: var(--ink); }
  .btn-ghost.is-armed { color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .pager .next { margin-left: auto; }

  /* Visão geral */
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 20px 0 0; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .facts div { background: var(--surface); padding: 12px 14px; }
  .facts dt { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .facts dd { margin: 2px 0 0; font: 800 20px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
  .days { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .days li { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
  .day-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .day-h span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .days p { margin: 4px 0 0; font-size: 15px; }
  .order { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
  .order-row {
    width: 100%; display: grid; grid-template-columns: 30px 1fr auto 16px; gap: 12px; align-items: center;
    padding: 9px 10px; border: 1px solid transparent; border-radius: 12px; background: none; cursor: pointer; text-align: left;
    transition: background .2s, border-color .2s;
  }
  .order-row:hover { background: var(--surface-2); border-color: var(--line); }
  .order-row .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .order-row.is-done .n { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
  .order-row .tm { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .order-row svg { width: 16px; height: 16px; color: var(--muted); }
  .shop + .shop { margin-top: 18px; }

  @media (min-width: 980px) {
    .app { height: 100%; }
    .main { grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
    .viewer { height: auto; min-height: 0; }
    .panel { overflow-y: auto; min-height: 0; scrollbar-width: thin; }
  }
  @media (max-width: 520px) {
    .top { padding-block: 12px; }
    .brand h1 { font-size: 18px; }
    .bar { display: none; }
    .tb .lbl-opt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .tb.icon-only { padding: 8px 11px; }
    .content { padding-inline: 16px; }
    .order-row { grid-template-columns: 30px 1fr auto; }
    .order-row svg { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 38 38" aria-hidden="true">
        <rect width="38" height="38" rx="11" style="fill: var(--accent)"/>
        <path d="M19 6.5v4.2M17 8.3h4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M19 10.7c-4.4 3.1-7.6 5.8-7.6 10.1 0 2.8 2.1 4.8 4.4 4.8h6.4c2.3 0 4.4-2 4.4-4.8 0-4.3-3.2-7-7.6-10.1z" fill="#fff"/>
        <path d="M15 14.5c2.5 1.5 5.5 3.8 7.6 7.4M13.2 18.6c2.4 1.2 4.6 3 6.2 5.8" stroke="#B8202F" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".55"/>
        <rect x="12" y="26.3" width="14" height="5.2" rx="1.2" fill="#fff" opacity=".85"/>
      </svg>
      <div>
        <h1>Maquete de Moscou</h1>
        <p>EVA · papelão · cola · massinha</p>
      </div>
    </div>
    <div class="prog" aria-live="polite">
      <div class="bar" aria-hidden="true"><span id="progFill"></span></div>
      <span id="progText">0 de 0 passos</span>
    </div>
  </header>

  <main class="main">
    <section class="viewer" id="viewer" aria-label="Protótipo 3D da maquete. Toque numa peça ou num número para ver o passo a passo.">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="pins" id="pins"></div>
      <p class="hint" id="hint">Arraste para girar · pinça ou roda do mouse para zoom · toque numa peça</p>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="toolbar" role="toolbar" aria-label="Controles do 3D">
        <button class="tb" type="button" id="btnHome">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          Visão geral

    } catch (err) {

      document.getElementById('loadingText').innerHTML = 'Não foi possível abrir o 3D neste aparelho.<p>O passo a passo completo continua funcionando aqui ao lado.</p>';
      document.getElementById('hint').hidden = true;
      document.querySelector('.toolbar').hidden = true;
    }
  });
})();
</script>
